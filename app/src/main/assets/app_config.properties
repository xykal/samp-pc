# ============================================================
#  Konfigurasi SAMP PC — ubah di sini, tidak perlu sentuh kode
# ============================================================

# Nama yang tampil di launcher & judul
app.label=XversSamp

# Server default (host:port). Port SA-MP default 7777.
server.default=play.sa-mp.com:7777

# ---- Sumber paket data ----

# Paket asli (RAR, 680 MB) di Google Drive. Boleh ditempel apa adanya
# dalam bentuk link "share" — app yang mengubahnya jadi unduhan langsung.
pack.archiveUrl=https://drive.google.com/file/d/1mzfzP-8Q-7gR5OWPvthJ9ML8zyrr9V-o/view?usp=sharing

# Client SA-MP (24 MB) — di-host terpisah, otomatis diunduh setelah paket utama.
pack.clientUrl=https://github.com/xykal/samp-pc-download/releases/download/v1.1.0/samp-client.zip

# Mode per-file (kalau punya hosting sendiri). Kosongkan kalau pakai arsip.
pack.baseUrl=
