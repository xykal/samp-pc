# ============================================================
#  Konfigurasi SAMP PC — ubah di sini, tidak perlu sentuh kode
# ============================================================

# Nama yang tampil di launcher & judul
app.label=NamaKomunitas PC

# Server default (host:port). Port SA-MP default 7777.
server.default=play.domainkamu.com:7777

# ---- Hosting paket data (pilih SALAH SATU) ----

# A. Per-file (disarankan): serve folder game apa adanya.
#    Contoh: https://cdn.domainkamu.com/samp/models/gta3.img
#    Kosongkan kalau pakai mode arsip.
pack.baseUrl=https://cdn.domainkamu.com/samp

# B. Satu arsip ZIP per tier. Kalau diisi, mode ini yang dipakai.
#    Contoh: https://cdn.domainkamu.com/samp/pack-extreme.zip
pack.archiveUrl=
