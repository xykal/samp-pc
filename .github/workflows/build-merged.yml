name: Build Merged APK (Winlator + SAMP PC)

# Menggabungkan source SAMP PC ke fork Winlator lalu build SATU APK.
# Diverifikasi terhadap: StevenMXZ/Winlator-Ludashi branch "4.1"
#   - Groovy build script, AGP 8.8.0, Gradle wrapper 8.10.2, namespace com.winlator.cmod
#   - minSdk 28 / targetSdk 28 / compileSdk 35
#   - buildFeatures tanpa buildConfig -> karena itu app kita TIDAK memakai BuildConfig
#     (konfigurasi ada di assets/app_config.properties)

on:
  workflow_dispatch:
    inputs:
      fork_repo:
        description: 'repo fork Winlator (owner/name)'
        required: true
        default: 'StevenMXZ/Winlator-Ludashi'
      fork_branch:
        description: 'branch'
        required: true
        default: '4.1'
      remove_stock_launcher:
        description: 'hapus ikon launcher Winlator asli (1 ikon saja)'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout SAMP PC
        uses: actions/checkout@v4
        with:
          path: samp

      - name: Clone fork Winlator
        run: |
          set -x
          git clone --depth 1 --branch "${{ inputs.fork_branch }}" \
            "https://github.com/${{ inputs.fork_repo }}.git" winlator
          echo "== struktur =="
          ls winlator
          grep -m1 "namespace" winlator/app/build.gradle || true
          grep -m1 "distributionUrl" winlator/gradle/wrapper/gradle-wrapper.properties || true

      # adrenotools & OpenXR-SDK adalah git submodule. Clone dangkal TIDAK
      # membawanya, akibatnya CMake gagal: "adrenotools does not contain a
      # CMakeLists.txt file". Ambil submodule, lalu fallback clone manual.
      - name: Ambil git submodule (adrenotools + OpenXR-SDK)
        run: |
          set -x
          git -C winlator submodule update --init --recursive --depth 1 \
            app/src/main/cpp/OpenXR-SDK app/src/main/cpp/adrenotools || true
          git -C winlator submodule update --init --recursive --depth 1 || true

          if [ ! -f winlator/app/src/main/cpp/adrenotools/CMakeLists.txt ]; then
            echo "adrenotools kosong -> clone manual"
            rm -rf winlator/app/src/main/cpp/adrenotools
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/Pipetto-crypto/libadrenotools.git \
              winlator/app/src/main/cpp/adrenotools
          fi

          if [ ! -f winlator/app/src/main/cpp/OpenXR-SDK/CMakeLists.txt ]; then
            echo "OpenXR-SDK kosong -> clone manual"
            rm -rf winlator/app/src/main/cpp/OpenXR-SDK
            git clone --depth 1 --branch release-1.1.38 --recurse-submodules \
              https://github.com/KhronosGroup/OpenXR-SDK.git \
              winlator/app/src/main/cpp/OpenXR-SDK \
              || git clone --depth 1 --recurse-submodules \
                   https://github.com/KhronosGroup/OpenXR-SDK.git \
                   winlator/app/src/main/cpp/OpenXR-SDK
          fi

          echo "== cek submodule =="
          ls winlator/app/src/main/cpp/adrenotools | head -20
          test -f winlator/app/src/main/cpp/adrenotools/CMakeLists.txt && echo "adrenotools OK"
          test -f winlator/app/src/main/cpp/OpenXR-SDK/CMakeLists.txt && echo "OpenXR OK"

      - name: Branding (ikon + nama app)
        run: |
          set -e
          R=winlator/app/src/main/res
          S=samp/branding/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$R/mipmap-$d"
            cp -f "$S/mipmap-$d/ic_launcher.png"       "$R/mipmap-$d/"
            cp -f "$S/mipmap-$d/ic_launcher_round.png" "$R/mipmap-$d/"
            cp -f "$S/mipmap-$d/ic_launcher_fore.png"  "$R/mipmap-$d/"
          done
          mkdir -p "$R/mipmap-anydpi-v26"
          cp -f "$S/mipmap-anydpi-v26/"*.xml "$R/mipmap-anydpi-v26/"
          cp -f "$S/values/ic_launcher_bg.xml" "$R/values/"
          ls -l "$R/mipmap-xxhdpi" | head

      - name: Hapus tulisan "Winlator" di resource engine
        run: |
          python3 - <<'PY'
          import pathlib, re

          # 1) resource XML: hanya isi teks & nilai atribut
          n_res = 0
          for f in pathlib.Path('winlator/app/src/main/res').rglob('*.xml'):
              s = f.read_text(errors='ignore')
              t = re.sub(r'>([^<>]*)<',
                         lambda m: '>' + m.group(1).replace('Winlator', 'XversSamp') + '<', s)
              t = t.replace('="Winlator', '="XversSamp')
              t = t.replace('"Winlator:X11"', '"XversSamp:X11"')
              if t != s:
                  f.write_text(t)
                  n_res += 1

          # 2) kode Java/Kotlin: HANYA di dalam string literal, supaya nama
          #    class (WinlatorHUD, WinlatorTheme...) dan package tetap utuh
          n_src = 0
          for ext in ('*.java', '*.kt'):
              for f in pathlib.Path('winlator/app/src/main/java').rglob(ext):
                  s = f.read_text(errors='ignore')
                  def fix(m):
                      lit = m.group(1)
                      # jangan sentuh nama class/package/URL di dalam string:
                      # URL ikut berubah = 404 (ketahuan di audit APK v1.8.0)
                      if ('com.winlator' in lit or 'Lcom/' in lit or '$' in lit
                              or 'http://' in lit or 'https://' in lit
                              or 'github.com' in lit or 'githubusercontent' in lit):
                          return m.group(0)
                      return '"' + lit.replace('Winlator', 'XversSamp') + '"'
                  t = re.sub(r'"([^"\n]*)"', fix, s)
                  if t != s:
                      f.write_text(t)
                      n_src += 1

          print('resource diubah:', n_res, '| source diubah:', n_src)
          PY
          grep -rn "Winlator" winlator/app/src/main/res/values/strings.xml | head -5 || true

      - name: Tempel source + assets SAMP PC
        run: |
          set -e
          SRC=samp/app/src/main
          DST=winlator/app/src/main
          mkdir -p "$DST/java/com/sampwrap"
          cp -r "$SRC/java/com/sampwrap/app"  "$DST/java/com/sampwrap/"
          cp -r "$SRC/java/com/sampwrap/core" "$DST/java/com/sampwrap/"
          mkdir -p "$DST/assets"
          cp "$SRC/assets/control_layout.json"      "$DST/assets/"
          cp "$SRC/assets/manifest_default.tsv"     "$DST/assets/"
          cp "$SRC/assets/app_config.properties"    "$DST/assets/"
          echo "== hasil =="
          find "$DST/java/com/sampwrap" -name '*.java' | wc -l

      # Ekstraktor RAR5/UnRAR untuk sisi Android (paket Drive bentuknya RAR).
      - name: Pasang modul sampunrar (JNI unrar)
        run: |
          set -e
          CPP=winlator/app/src/main/cpp
          mkdir -p "$CPP/sampunrar/unrar"
          cp -r samp/native/unrar/. "$CPP/sampunrar/unrar/"
          cp samp/native/sampunrar_jni.cpp "$CPP/sampunrar/"

          cat >> "$CPP/CMakeLists.txt" <<'CMAKE'

          # ===== SAMP PC: ekstraktor RAR (UnRAR RARLAB) =====
          set(SAMPUNRAR_DIR ${CMAKE_CURRENT_SOURCE_DIR}/sampunrar)
          # Daftar resmi dari makefile unrar (banyak .cpp lain di-include oleh
          # file-file ini, mis. unpack.cpp memuat unpack50.cpp dst).
          set(SAMPUNRAR_SRC
          ${SAMPUNRAR_DIR}/unrar/rar.cpp
          ${SAMPUNRAR_DIR}/unrar/strlist.cpp
          ${SAMPUNRAR_DIR}/unrar/strfn.cpp
          ${SAMPUNRAR_DIR}/unrar/pathfn.cpp
          ${SAMPUNRAR_DIR}/unrar/smallfn.cpp
          ${SAMPUNRAR_DIR}/unrar/global.cpp
          ${SAMPUNRAR_DIR}/unrar/file.cpp
          ${SAMPUNRAR_DIR}/unrar/filefn.cpp
          ${SAMPUNRAR_DIR}/unrar/filcreat.cpp
          ${SAMPUNRAR_DIR}/unrar/archive.cpp
          ${SAMPUNRAR_DIR}/unrar/arcread.cpp
          ${SAMPUNRAR_DIR}/unrar/unicode.cpp
          ${SAMPUNRAR_DIR}/unrar/system.cpp
          ${SAMPUNRAR_DIR}/unrar/crypt.cpp
          ${SAMPUNRAR_DIR}/unrar/crc.cpp
          ${SAMPUNRAR_DIR}/unrar/rawread.cpp
          ${SAMPUNRAR_DIR}/unrar/encname.cpp
          ${SAMPUNRAR_DIR}/unrar/resource.cpp
          ${SAMPUNRAR_DIR}/unrar/match.cpp
          ${SAMPUNRAR_DIR}/unrar/timefn.cpp
          ${SAMPUNRAR_DIR}/unrar/rdwrfn.cpp
          ${SAMPUNRAR_DIR}/unrar/consio.cpp
          ${SAMPUNRAR_DIR}/unrar/options.cpp
          ${SAMPUNRAR_DIR}/unrar/errhnd.cpp
          ${SAMPUNRAR_DIR}/unrar/rarvm.cpp
          ${SAMPUNRAR_DIR}/unrar/secpassword.cpp
          ${SAMPUNRAR_DIR}/unrar/rijndael.cpp
          ${SAMPUNRAR_DIR}/unrar/getbits.cpp
          ${SAMPUNRAR_DIR}/unrar/sha1.cpp
          ${SAMPUNRAR_DIR}/unrar/sha256.cpp
          ${SAMPUNRAR_DIR}/unrar/blake2s.cpp
          ${SAMPUNRAR_DIR}/unrar/hash.cpp
          ${SAMPUNRAR_DIR}/unrar/extinfo.cpp
          ${SAMPUNRAR_DIR}/unrar/extract.cpp
          ${SAMPUNRAR_DIR}/unrar/volume.cpp
          ${SAMPUNRAR_DIR}/unrar/list.cpp
          ${SAMPUNRAR_DIR}/unrar/find.cpp
          ${SAMPUNRAR_DIR}/unrar/unpack.cpp
          ${SAMPUNRAR_DIR}/unrar/headers.cpp
          ${SAMPUNRAR_DIR}/unrar/threadpool.cpp
          ${SAMPUNRAR_DIR}/unrar/rs16.cpp
          ${SAMPUNRAR_DIR}/unrar/cmddata.cpp
          ${SAMPUNRAR_DIR}/unrar/ui.cpp
          ${SAMPUNRAR_DIR}/unrar/largepage.cpp
          ${SAMPUNRAR_DIR}/unrar/filestr.cpp
          ${SAMPUNRAR_DIR}/unrar/scantree.cpp
          ${SAMPUNRAR_DIR}/unrar/dll.cpp
          ${SAMPUNRAR_DIR}/unrar/qopen.cpp)
          add_library(sampunrar SHARED
                  ${SAMPUNRAR_DIR}/sampunrar_jni.cpp
                  ${SAMPUNRAR_SRC})
          target_compile_definitions(sampunrar PRIVATE
                  _UNIX RARDLL RAR_SMP _FILE_OFFSET_BITS=64 _LARGEFILE_SOURCE)
          target_compile_options(sampunrar PRIVATE
                  -O2 -fexceptions -frtti -Wno-switch
                  -Wno-logical-op-parentheses -Wno-dangling-else
                  -Wno-unused-parameter -Wno-missing-field-initializers)
          target_include_directories(sampunrar PRIVATE ${SAMPUNRAR_DIR}/unrar)
          target_link_libraries(sampunrar log)
          CMAKE

          echo "== cek =="
          ls "$CPP/sampunrar" | head -3
          ls "$CPP/sampunrar/unrar" | wc -l
          tail -5 "$CPP/CMakeLists.txt"

      - name: Patch AndroidManifest
        env:
          REMOVE_STOCK: ${{ inputs.remove_stock_launcher }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('winlator/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if os.environ.get('REMOVE_STOCK', 'true') == 'true':
              # buang SEMUA intent-filter LAUNCHER (format apa pun), nanti
              # launcher kita ditambahkan lewat blok di bawah
              pat = re.compile(
                  r'<intent-filter[^>]*>(?:(?!</intent-filter>).)*?'
                  r'category\.LAUNCHER(?:(?!</intent-filter>).)*?</intent-filter>',
                  re.S)
              s, n = pat.subn('', s)
              print('launcher lama dihapus:', n)

          # nama aplikasi
          s = s.replace('android:label="Winlator Ludashi"', 'android:label="XversSamp"')

          block = '''
              <!-- ===== SAMP PC frontend ===== -->
              <activity android:name="com.sampwrap.app.MainActivity"
                        android:exported="true"
                        android:label="XversSamp"
                        android:screenOrientation="portrait"
                        android:configChanges="keyboardHidden|orientation|screenSize">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>

              <activity android:name="com.sampwrap.app.ControlsActivity"
                        android:exported="false"
                        android:screenOrientation="landscape"
                        android:configChanges="keyboardHidden|orientation|screenSize" />

              <service android:name="com.sampwrap.app.InstallService"
                        android:exported="false"
                        android:process=":sync"
                        android:foregroundServiceType="dataSync" />
          '''
          s = s.replace('</application>', block + '\n    </application>')
          p.write_text(s)
          print('manifest dipatch')
          PY
          grep -n "sampwrap" winlator/app/src/main/AndroidManifest.xml | head

      - name: Tambah permission & string yang dibutuhkan
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('winlator/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          need = [
            'android.permission.INTERNET',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.WAKE_LOCK',
          ]
          add = ''.join(
            f'    <uses-permission android:name="{n}" />\n' for n in need
            if n not in s)
          if add:
              s = s.replace('<application', add + '\n    <application', 1)
              p.write_text(s)
          print('permission ditambahkan:', bool(add))

          # string app_name (kalau belum ada)
          sp = pathlib.Path('winlator/app/src/main/res/values/strings.xml')
          t = sp.read_text()
          if 'name="app_name"' not in t:
              t = t.replace('<resources>', '<resources>\n    <string name="app_name">SAMP PC</string>')
              sp.write_text(t)
              print('app_name ditambahkan')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # CMakeLists fork memanggil "glslangValidator" (bukan glslc NDK) untuk
      # meng-compile window.vert/window.frag. Tanpa ini build mati dengan
      # "/bin/sh: 1: glslangValidator: not found".
      - name: Pasang glslang-tools (compiler shader)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools || sudo apt-get install -y -qq glslang
          which glslangValidator || ls -l /usr/bin/glslang* || true
          glslangValidator --version | head -3 || true

      # R8 (minify + resource shrink) + ABI split untuk build rilis.
      - name: Optimasi rilis (R8 + shrinkResources)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('winlator/app/build.gradle')
          s = p.read_text()

          # Catatan: ABI split TIDAK mungkin di fork ini karena build.gradle sudah
          # memakai ndk.abiFilters 'arm64-v8a' (AGP menolak keduanya sekaligus),
          # dan engine ini memang hanya membangun arm64-v8a.

          # 2. release: nyalakan R8 + shrink resources + daftar rules
          m = re.search(r"release\s*\{", s)
          if not m:
              raise SystemExit('blok release tidak ditemukan')
          i = m.end(); depth = 1; j = i
          while j < len(s) and depth:
              if s[j] == '{': depth += 1
              elif s[j] == '}': depth -= 1
              j += 1
          block = s[i:j-1]
          block = block.replace('minifyEnabled false', 'minifyEnabled true')
          if 'shrinkResources' not in block:
              block = block.replace('signingConfig signingConfigs.debug',
                                    'signingConfig signingConfigs.debug\n            shrinkResources true')
          if 'proguardFiles' not in block:
              block = block.replace('minifyEnabled true',
                                    "minifyEnabled true\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'")
          s = s[:i] + block + s[j-1:]
          p.write_text(s)
          print('--- release block ---')
          print(re.search(r"release\s*\{[^}]*\}", s).group(0))

          # 3. keep rules
          rules = pathlib.Path('winlator/app/proguard-rules.pro')
          rules.write_text(rules.read_text() + """

          # ===== SAMP PC =====
          -dontwarn **
          # app kita: semua dipakai lewat nama (JNI/refleksi)
          -keep class com.sampwrap.** { *; }
          # engine: JANGAN di-shrink/rename sama sekali (JNI Java_com_winlator_*,
          # .desktop, JSON, refleksi internal). Yang dihemat: library (Compose,
          # AndroidX, Kotlin) yang jumlahnya puluhan MB di dex.
          -keep class com.winlator.** { *; }
          # entry point yang dipanggil app lewat refleksi (EngineBridge)
          -keep class com.winlator.cmod.container.ContainerManager { *; }
          -keep class com.winlator.cmod.container.Container { *; }
          -keep class com.winlator.cmod.contents.ContentsManager { *; }
          -keep class com.winlator.cmod.XServerDisplayActivity { *; }
          -keep class com.winlator.cmod.MainActivity { *; }
          # JNI
          -keepclasseswithmembernames,includedescriptorclasses class * { native <methods>; }
          # Android komponen
          -keep class * extends android.app.Service { *; }
          -keep class * extends android.app.Activity { *; }
          -keep class * extends android.content.ContentProvider { *; }
          """)
          print('--- rules ---')
          print(rules.read_text()[-600:])
          PY
          grep -n "minifyEnabled\|shrinkResources\|splits {" winlator/app/build.gradle | head

      # Fork menyalin banyak res AppCompat (drawable/layout) yang menunjuk
      # @id/checked, @id/spinner, @id/seekbar, dst — tapi res/values/ids.xml
      # tidak ada, jadi AAPT gagal saat build release. Daripada tambal satu-satu,
      # kumpulkan SEMUA @id/ yang dipakai tapi belum dideklarasikan.
      - name: Lengkapi res/values/ids.xml (auto-deteksi id yang hilang)
        run: |
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path('winlator/app/src/main/res')
          used, declared = set(), set()
          for f in root.rglob('*.xml'):
              t = f.read_text(errors='ignore')
              used |= set(re.findall(r'(?<!\+)@id/([A-Za-z0-9_]+)', t))
              declared |= set(re.findall(r'@\+id/([A-Za-z0-9_]+)', t))
          missing = sorted(used - declared)
          out = root / 'values' / 'ids.xml'
          body = '\n'.join('    <item name="%s" type="id"/>' % m for m in missing)
          out.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                         + body + '\n</resources>\n')
          print('id dipakai:', len(used), '| dideklarasikan:', len(declared),
                '| ditambahkan:', len(missing))
          print(missing)
          PY
          cat winlator/app/src/main/res/values/ids.xml

      - name: Build APK gabungan
        working-directory: winlator
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --no-daemon -x lint -x lintVitalRelease \
            > /tmp/gradle-build.log 2>&1
          RC=$?
          echo "EXIT CODE GRADLE: $RC"
          echo "=========== 60 BARIS TERAKHIR ==========="
          tail -60 /tmp/gradle-build.log
          echo "=========== BLOK 'WHAT WENT WRONG' ==========="
          awk '/What went wrong/{f=1} f{print} /\* Try:/{if(f)exit}' /tmp/gradle-build.log | head -200
          echo "=========== BARIS CMake/COMPILE ERROR ==========="
          grep -n -E "CMake Error|CMake Warning|error:|error;|e: file|^e: |No such file|fatal error|FAILED" \
            /tmp/gradle-build.log | head -60
          echo "====================================="
          exit $RC

      - name: Upload log gradle (kalau gagal)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Info APK
        if: always()
        run: |
          find winlator/app/build/outputs -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || echo "tidak ada APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samp-pc-merged-apk
          path: winlator/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
