name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Tidak pakai gradle-wrapper.jar (biar repo ringan & nggak kena blokir
      # binary). Setup-gradle menyediakan Gradle 8.9.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit test core (tanpa Android SDK)
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find app/src/main/java/com/sampwrap/core -name '*.java') \
                app/src/test/java/CoreTest.java app/src/test/java/DownloadTest.java
          java -Dfile.encoding=UTF-8 -cp out CoreTest
          # resume/416/HTML: pakai server HTTP lokal, bukan jaringan luar
          java -Dfile.encoding=UTF-8 -cp out DownloadTest

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samp-pc-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach to release (kalau push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
