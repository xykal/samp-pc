name: Build Wine bionic (ARM64) — engine sendiri

# Tujuan: Wine yang bisa jalan LANGSUNG di Android (bionic/NDK), bukan glibc.
# Layer Proton bawaan di APK terbukti bionic:
#   file ntdll.so -> "ELF 64-bit ARM aarch64 ... for Android"
# jadi build glibc (percobaan pertama) tidak bisa dipakai.
#
# Tahap 1 (tahap ini): buktikan toolchain bionic utuh —
#   bin/wine + bin/wineserver + lib/wine/aarch64-unix/*.so  (ELF bionic)
#   lib/wine/i386-windows/*.dll                              (PE 32-bit, untuk SA-MP)
# X11/GL/Vulkan ditambahkan di tahap 2 (lib-nya ada di imagefs, usr/lib/*.so).

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: 'Wine source version (folder/tag)'
        required: true
        default: '10.17'
      api_level:
        description: 'Android API level untuk NDK clang'
        required: true
        default: '28'
      with_x11:
        description: 'Tahap 2: link X11/GL dari imagefs'
        required: true
        default: 'false'

env:
  NDK_VERSION: r27c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Info
        run: |
          nproc; free -h | head -2; df -h / | tail -1

      - name: Bebaskan disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib bison flex pkg-config gettext \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            xz-utils zstd curl unzip file \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxfixes-dev \
            libxcursor-dev libxi-dev libxcomposite-dev libxinerama-dev libxcb1-dev
          i686-w64-mingw32-gcc --version | head -1

      - name: Android NDK
        run: |
          curl -sL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          ls android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin | grep -E "aarch64-linux-android${INPUT_API}-clang$" | head -3
        env:
          INPUT_API: 28

      - name: Source Wine (tree dengan patch Winlator)
        run: |
          set -e
          git clone --depth 1 https://github.com/mihsian77/wine-10.17-winlator.git wine-src
          cd wine-src
          echo "VERSION=$(cat VERSION 2>/dev/null || echo ${{ inputs.wine_version }})"
          ls dlls | wc -l
          grep -c "linux-android" configure.ac

      - name: Ambil lib bionic (imagefs) + header
        run: |
          set -e
          # lib .so ARM64 bionic untuk target link (X11/GL/Vulkan dsb)
          curl -sL -o apk.apk \
            "https://github.com/xykal/samp-pc-download/releases/download/v1.8.1/xverssamp-v1.8.1-merged.apk"
          python3 - <<'PY'
          import zipfile, io, zstandard as zstd, tarfile, os
          z = zipfile.ZipFile('apk.apk')
          raw = z.read('assets/imagefs.tar.zst')
          d = zstd.ZstdDecompressor()
          os.makedirs('/opt/imagefs', exist_ok=True)
          keep = ('usr/lib/', 'usr/include/')
          n = 0
          with d.stream_reader(io.BytesIO(raw)) as r:
              tf = tarfile.open(fileobj=r, mode='r|')
              for m in tf:
                  if not m.name.startswith(keep) or not m.isfile():
                      continue
                  try:
                      tf.extract(m, '/opt/imagefs')
                      n += 1
                  except Exception:
                      pass
                  if n > 3000:
                      break
          print('extracted', n)
          PY
          ls /opt/imagefs/usr/lib | head -5
          ls /opt/imagefs/usr/include 2>/dev/null | head -3 || echo "(tanpa header)"
          rm -f apk.apk

      - name: Header X11 (terpisah dari glibc host)
        run: |
          set -e
          # JANGAN pakai -I/usr/include: header glibc host (pthread.h) akan
          # menimpa header bionic dari NDK.
          mkdir -p /opt/xinc
          cp -r /usr/include/X11 /opt/xinc/
          [ -d /usr/include/xcb ] && cp -r /usr/include/xcb /opt/xinc/ || true
          ls /opt/xinc | head

      - name: Stage 0 — native tools (host)
        run: |
          set -eo pipefail
          mkdir -p tools-build
          cd tools-build
          with_x=no with_freetype=no with_fontconfig=no \
          ../wine-src/configure --prefix=$PWD/../tools-inst \
            --enable-archs=x86_64 --without-x --without-freetype --without-fontconfig \
            --disable-tests --disable-win16 > cfg.out 2>&1 || { tail -20 cfg.out; exit 1; }
          tail -5 cfg.out
          make -j"$(nproc)" __tooldeps__ 2>&1 | tail -5
          make -C nls -j"$(nproc)" 2>&1 | tail -3
          ls ../wine-src/tools/winebuild/winebuild ../wine-src/tools/wrc/wrc 2>/dev/null || true

      - name: Configure — cross ke aarch64-linux-android (bionic)
        run: |
          set -eo pipefail
          export NDK=$NDK_HOME
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=${{ inputs.api_level }}
          export PATH="$TC/bin:$PATH"
          mkdir -p build-android && cd build-android

          export CC="$TC/bin/aarch64-linux-android${API}-clang"
          export CXX="$TC/bin/aarch64-linux-android${API}-clang++"
          export AR=llvm-ar RANLIB=llvm-ranlib STRIP=llvm-strip LD=ld.lld
          export CFLAGS="-O2 -fPIC -D__ANDROID_API__=${API}"
          # .so bionic (ARM64) ada di imagefs, jangan sampai ke-link lib x86 host
          export LDFLAGS="-L/opt/imagefs/usr/lib -fuse-ld=lld"

          # bionic tidak punya beberapa fungsi glibc -> beri tahu cache
          export ac_cv_func_getpwent=no ac_cv_func_getpwnam=no ac_cv_func_getpwuid=no
          export ac_cv_func_sigsetmask=no ac_cv_func_fallocate=no ac_cv_func_strverscmp=no
          export ac_cv_func_getusershell=no ac_cv_func_posix_fadvise=yes
          export ac_cv_func_openpty=yes ac_cv_func_fork=yes
          unset PKG_CONFIG_PATH

          # soname dari imagefs (bionic). Tanpa ini configure tidak menemukan
          # -lX11 dan menghasilkan "SONAME_LIBX11 undeclared" saat compile.
          export ac_cv_lib_soname_X11=libX11.so.6
          export ac_cv_lib_soname_XEXT=libXext.so.6
          export ac_cv_lib_soname_XRENDER=libXrender.so.1
          export ac_cv_lib_soname_XRANDR=libXrandr.so.2
          export ac_cv_lib_soname_XFIXES=libXfixes.so.3
          export ac_cv_lib_soname_XCURSOR=libXcursor.so.1
          export ac_cv_lib_soname_XCOMPOSITE=libXcomposite.so.1
          export ac_cv_lib_soname_XI=libXi.so.6
          export ac_cv_lib_soname_XINERAMA=libXinerama.so.1
          export ac_cv_lib_soname_X11_XCB=libX11-xcb.so.1

          # configure kadang mengabaikan --without-* saat cross; paksa lewat env
          with_x=yes enable_wineandroid_drv=no with_freetype=no with_fontconfig=no with_vulkan=no \
          with_pulse=no with_alsa=no with_oss=no with_gstreamer=no with_dbus=no \
          ../wine-src/configure \
            --host=aarch64-linux-android \
            --with-wine-tools=../tools-build \
            --prefix=/opt/wine-ours \
            --enable-archs=i386 \
            --with-mingw=i686-w64-mingw32 \
            --with-x --x-includes=/opt/xinc --x-libraries=/opt/imagefs/usr/lib \
            --without-freetype --without-fontconfig \
            --without-vulkan --without-pulse --without-alsa --without-oss \
            --without-gstreamer --without-dbus --without-gnutls --without-krb5 \
            --without-cups --without-sane --without-udev --without-usb --without-v4l2 \
            --without-wayland --without-coreaudio --without-capi --without-netapi \
            --without-opencl --without-ffmpeg --without-sdl --without-openal \
            --without-mpg123 --without-gphoto --without-pcap --without-pcsclite \
            --disable-tests --disable-win16 \
            > configure.out 2>&1 || {
              echo "===== CONFIGURE GAGAL =====";
              tail -25 configure.out;
              echo "----- config.log (ekor) -----";
              tail -60 config.log || true;
              exit 1;
            }

          tail -25 configure.out
          echo "=== config.h inti ==="
          grep -E "HAVE_(FORK|EXECV|POSIX_SPAWN|PTHREAD)_" include/config.h | head -8 || true

      - name: Compile
        run: |
          set -eo pipefail
          cd build-android
          make -j"$(nproc)" 2>&1 | tail -60

      - name: Hasil + paketkan
        run: |
          set -eo pipefail
          cd build-android
          make install 2>&1 | tail -10
          cd /opt/wine-ours
          echo "=== struktur ==="
          ls bin lib/wine 2>/dev/null | head -20
          echo "=== tipe file (harus 'for Android' / bionic) ==="
          file bin/wine bin/wineserver lib/wine/aarch64-unix/ntdll.so 2>/dev/null | sed 's/, BuildID.*//'
          echo "=== PE 32-bit ==="
          file lib/wine/i386-windows/ntdll.dll 2>/dev/null
          du -sh .
          tar -c --owner=0 --group=0 . | zstd -19 -T0 -o /tmp/wine-ours-bionic.tar.zst
          ls -l /tmp/wine-ours-bionic.tar.zst
          sha256sum /tmp/wine-ours-bionic.tar.zst

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-bionic-arm64
          path: /tmp/wine-ours-bionic.tar.zst
          if-no-files-found: warn
          retention-days: 7
